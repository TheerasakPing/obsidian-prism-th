name: Locale validation

on:
  push:
    branches: [main]
    paths:
      - "locales/**"
      - "scripts/validate-locales.mjs"
      - ".github/workflows/locale-validation.yml"
  pull_request:
    paths:
      - "locales/**"
      - "scripts/validate-locales.mjs"
      - ".github/workflows/locale-validation.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Validate locale parity
        run: npm run validate:locales
